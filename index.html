<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30-Day Content Calendar Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f4f8; --panel:#ffffff; --ink:#16213a; --muted:#5d6985; --line:#d8deea; --accent:#2f4bd8; --accent-ink:#ffffff;
  --c-educate:#2f6fd8; --c-proof:#1f9d77; --c-bts:#c2761a; --c-engage:#a23fc4; --c-promo:#d23f5b; --c-trend:#5b6b7f;
  --tint:12%;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f1424; --panel:#171e33; --ink:#e9edf8; --muted:#97a2bd; --line:#2a3452; --accent:#8da2ff; --accent-ink:#0f1424;
  --c-educate:#6ea2ff; --c-proof:#4cd1a3; --c-bts:#f0a54a; --c-engage:#d28cf0; --c-promo:#ff7f98; --c-trend:#a4b2c6; --tint:18%;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 26px;max-width:60ch}
.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{font-size:1rem;margin:0 0 14px;font-weight:600}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{margin:0;font-weight:400;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.85rem}
.checks input:checked + span{font-weight:600}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:5.5em;text-align:right;font-weight:600;font-size:.9rem}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:11px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%;margin-top:18px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line);margin-top:0;width:auto;padding:8px 14px;font-size:.9rem}
.btn.alt:hover{border-color:var(--accent)}
.err{color:var(--c-promo);font-size:.85rem;margin-top:10px;min-height:1.2em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .actions{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stats{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:.78rem;font-weight:600;color:var(--muted);padding:2px 4px}
.cell{min-height:132px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px;font-size:.78rem;display:flex;flex-direction:column;gap:4px}
.cell.empty{background:transparent;border-style:dashed;opacity:.5}
.cell.off{background:transparent}
.cell .d{font-weight:600;color:var(--muted);font-size:.75rem}
.cell.post{border-left:4px solid var(--pc);background:color-mix(in srgb,var(--pc) var(--tint),var(--panel))}
.cell .meta{font-weight:600;color:var(--pc)}
.cell .topic{line-height:1.3}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:720px){
  .grid{grid-template-columns:1fr}.dow,.cell.empty,.cell.off{display:none}
  .cell{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>30-day content calendar generator</h1>
  <p class="sub">Enter your niche, pick your platforms and posting pace, and get a balanced month of post ideas. Download it as a CSV for Notion, Sheets or Excel.</p>

  <div class="layout">
    <form class="panel" id="form" autocomplete="off">
      <h2>Your plan</h2>

      <label for="niche">Niche or brand topic</label>
      <input type="text" id="niche" placeholder="e.g. natural sweeteners" required>

      <label for="audience">Audience (optional)</label>
      <input type="text" id="audience" placeholder="e.g. health-conscious home cooks">

      <label>Platforms</label>
      <div class="checks" id="platforms"></div>

      <label for="freq">Posts per week</label>
      <div class="range"><input type="range" id="freq" min="1" max="7" value="3"><output id="freqOut">3 per week</output></div>

      <label for="goal">Main goal</label>
      <select id="goal">
        <option value="awareness">Build awareness</option>
        <option value="leads" selected>Generate leads</option>
        <option value="sales">Drive sales</option>
      </select>

      <label for="start">Start date</label>
      <input type="date" id="start">

      <button class="btn" type="submit">Generate calendar</button>
      <div class="err" id="err" role="alert"></div>
    </form>

    <section aria-live="polite">
      <div id="out"><div class="empty-state">Fill in your niche and select <strong>Generate calendar</strong> to see your month.</div></div>
    </section>
  </div>
</div>

<script>
const PLATFORMS = {
  "Instagram": ["Reel","Carousel","Story series","Static post"],
  "LinkedIn": ["Text post","Document carousel","Poll","Article"],
  "X / Twitter": ["Thread","Single post","Poll"],
  "Facebook": ["Video","Link post","Photo post","Poll"],
  "YouTube": ["Short","Long-form video","Community post"],
  "Blog": ["How-to post","Listicle","Case study","Round-up"],
  "Email": ["Newsletter","Product spotlight","Story email"]
};

const PILLARS = {
  educate: {label:"Educate", color:"var(--c-educate)", cta:"Save this for later", topics:[
    "{n} basics: 5 things beginners get wrong","How to choose the right {n} (a simple checklist)","A myth about {n} that needs to retire",
    "{n} explained in 60 seconds","Step-by-step: getting started with {n}","Common questions about {n}, answered",
    "{n} mistakes to avoid this month","A quick guide to comparing {n} options","What the research says about {n}"]},
  proof: {label:"Social proof", color:"var(--c-proof)", cta:"Tell us your story in the comments", topics:[
    "Customer story: how {a} use {n}","Before and after: results from {n}","Review spotlight: what people say about {n}",
    "A number that shows our {n} progress","Testimonial roundup for {n}","Case study: a real outcome with {n}"]},
  bts: {label:"Behind the scenes", color:"var(--c-bts)", cta:"Follow along for more", topics:[
    "How we make decisions in {n}","A day in the life working with {n}","Why we started with {n}",
    "Meet the people behind {n}","What went wrong this week (and what we learned)","The tools and workflow we use for {n}"]},
  engage: {label:"Engage", color:"var(--c-engage)", cta:"Vote or reply below", topics:[
    "This or that: pick a side on {n}","Ask me anything about {n}","Poll: what is your biggest {n} challenge?",
    "Caption this: a fun {n} moment","Hot take on {n}: agree or disagree?","Share your {n} setup in the comments"]},
  promo: {label:"Promote", color:"var(--c-promo)", cta:"Get started today", topics:[
    "Offer spotlight: why {a} choose us for {n}","Product feature: the one thing people love most about {n}","Limited-time offer for {n}",
    "FAQ: is our {n} right for you?","Free resource: a starter kit for {n}","New arrival or update in our {n} range"]},
  trend: {label:"Trend and news", color:"var(--c-trend)", cta:"Share your take", topics:[
    "What changed in {n} this month","3 trends shaping {n} right now","Industry news: what it means for {a}",
    "Predictions for {n} next quarter","A viral idea we are testing in {n}"]}
};

const GOAL_WEIGHTS = {
  awareness:{educate:3,proof:1,bts:2,engage:3,promo:1,trend:2},
  leads:{educate:4,proof:2,bts:1,engage:2,promo:2,trend:1},
  sales:{educate:2,proof:3,bts:1,engage:1,promo:4,trend:1}
};

// weekday numbers use Monday = 0
const POST_DAYS = {1:[2],2:[1,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){return d.toISOString().slice(0,10)}

function buildPillarSequence(count,weights,rnd){
  const pool=[];
  Object.keys(weights).forEach(k=>{for(let i=0;i<weights[k];i++)pool.push(k)});
  const seq=[];let bag=[];
  while(seq.length<count){
    if(!bag.length)bag=shuffle(pool,rnd);
    let idx=bag.findIndex(p=>p!==seq[seq.length-1]);
    if(idx<0)idx=0;
    seq.push(bag.splice(idx,1)[0]);
  }
  return seq;
}

function generate(opts){
  const rnd=mulberry32(opts.seed);
  const start=new Date(opts.start+"T00:00:00Z");
  const days=[];
  const postDays=POST_DAYS[opts.freq];
  for(let i=0;i<30;i++){
    const d=new Date(start.getTime()+i*86400000);
    const wd=(d.getUTCDay()+6)%7;
    days.push({date:d,wd,post:postDays.includes(wd)});
  }
  const posts=days.filter(x=>x.post);
  const seq=buildPillarSequence(posts.length,GOAL_WEIGHTS[opts.goal],rnd);
  const topicQ={},fmtQ={};
  Object.keys(PILLARS).forEach(k=>topicQ[k]=shuffle(PILLARS[k].topics,rnd));
  opts.platforms.forEach(p=>fmtQ[p]=shuffle(PLATFORMS[p],rnd));
  const used={};
  const aud=opts.audience||"your customers";
  posts.forEach((day,i)=>{
    const pillar=seq[i];
    const platform=opts.platforms[i%opts.platforms.length];
    used[pillar]=(used[pillar]||0);
    const topic=topicQ[pillar][used[pillar]++%topicQ[pillar].length]
      .replace(/\{n\}/g,opts.niche).replace(/\{a\}/g,aud);
    const f=fmtQ[platform];
    const format=f[Math.floor(i/opts.platforms.length)%f.length];
    Object.assign(day,{pillar,platform,format,topic,cta:PILLARS[pillar].cta});
  });
  return days;
}

function render(days,opts){
  const posts=days.filter(d=>d.post);
  const counts={};posts.forEach(p=>counts[p.pillar]=(counts[p.pillar]||0)+1);
  const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let html=`<div class="bar"><div class="legend">${Object.keys(PILLARS).map(k=>`<span><i style="background:${PILLARS[k].color}"></i>${PILLARS[k].label}${counts[k]?` (${counts[k]})`:""}</span>`).join("")}</div>
  <div class="actions"><button class="btn alt" id="regen" type="button">Shuffle ideas</button><button class="btn alt" id="copy" type="button">Copy as text</button><button class="btn alt" id="csv" type="button">Download CSV</button></div></div>
  <p class="stats">${posts.length} posts across ${opts.platforms.length} platform${opts.platforms.length>1?"s":""} in 30 days.</p>
  <div class="grid">${names.map(n=>`<div class="dow">${n}</div>`).join("")}`;
  for(let i=0;i<days[0].wd;i++)html+=`<div class="cell empty"></div>`;
  days.forEach(d=>{
    const label=d.date.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
    if(d.post){
      html+=`<div class="cell post" style="--pc:${PILLARS[d.pillar].color}"><span class="d">${label}</span><span class="meta">${esc(d.platform)}: ${esc(d.format)}</span><span class="topic">${esc(d.topic)}</span></div>`;
    }else{
      html+=`<div class="cell off"><span class="d">${label}</span></div>`;
    }
  });
  html+=`</div>`;
  document.getElementById("out").innerHTML=html;
  document.getElementById("regen").onclick=()=>{state.seed=Math.floor(Math.random()*1e9);run()};
  document.getElementById("csv").onclick=()=>downloadCSV(days);
  document.getElementById("copy").onclick=e=>copyText(days,e.target);
}

function rows(days){
  return days.filter(d=>d.post).map(d=>[fmt(d.date),["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][d.wd],d.platform,PILLARS[d.pillar].label,d.format,d.topic,d.cta]);
}
function downloadCSV(days){
  const head=["Date","Day","Platform","Content pillar","Format","Topic idea","Call to action"];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[head,...rows(days)].map(r=>r.map(q).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="content-calendar.csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function copyText(days,btn){
  const text=rows(days).map(r=>`${r[0]} (${r[1]}) | ${r[2]} ${r[4]} | ${r[5]} | CTA: ${r[6]}`).join("\n");
  const done=()=>{const t=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=t,1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>{})}
}

const state={seed:1};
let lastOpts=null;

function readForm(){
  const niche=document.getElementById("niche").value.trim();
  const platforms=[...document.querySelectorAll("#platforms input:checked")].map(i=>i.value);
  const err=document.getElementById("err");
  if(!niche){err.textContent="Add your niche or brand topic.";return null}
  if(!platforms.length){err.textContent="Pick at least one platform.";return null}
  err.textContent="";
  return {niche,audience:document.getElementById("audience").value.trim(),platforms,
    freq:+document.getElementById("freq").value,goal:document.getElementById("goal").value,
    start:document.getElementById("start").value||fmt(new Date())};
}
function run(){
  const o=lastOpts;if(!o)return;
  o.seed=state.seed;
  render(generate(o),o);
}

// setup
const pl=document.getElementById("platforms");
Object.keys(PLATFORMS).forEach((p,i)=>{
  const l=document.createElement("label");
  l.innerHTML=`<input type="checkbox" value="${esc(p)}"${i<2?" checked":""}><span>${esc(p)}</span>`;
  pl.appendChild(l);
});
document.getElementById("start").value=fmt(new Date());
const freq=document.getElementById("freq"),freqOut=document.getElementById("freqOut");
freq.addEventListener("input",()=>freqOut.textContent=freq.value+(freq.value==="1"?" per week":" per week"));
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const o=readForm();if(!o)return;
  lastOpts=o;state.seed=Math.floor(Math.random()*1e9);run();
});
</script>
</body>
</html>
