<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>30-Day Content Calendar Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Flaviotte";src:local("Flaviotte"),url("fonts/Flaviotte.woff2") format("woff2"),url("fonts/Flaviotte.otf") format("opentype"),url("fonts/Flaviotte.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{
  color-scheme:dark;
  --paper:#12211A; --ink:#F9EBD7; --emerald:#046A38; --accent:#E34222;
  --muted:color-mix(in srgb,var(--ink) 72%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 25%,var(--paper));
  --soft:color-mix(in srgb,var(--ink) 10%,var(--paper));
  --c-educate:#2C5A45; --c-proof:#6A4B42; --c-bts:#665B33; --c-engage:#4E4468; --c-promo:#6E4048; --c-trend:#35566A;
  --display:"Flaviotte",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:72px 28px 40px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,8vw,5.6rem);line-height:.98;letter-spacing:-.025em;margin:0 0 22px;max-width:14ch}
.sub{font-size:1.15rem;color:var(--muted);margin:0 0 64px;max-width:46ch}
form{margin:0 0 80px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 56px}
.full{grid-column:1/-1}
label.l,.l{display:block;font-size:.9rem;color:var(--muted);margin:0 0 8px}
input[type=text],input[type=date],select{width:100%;font:inherit;font-size:1.2rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 0 10px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:28px}
input::placeholder{color:color-mix(in srgb,var(--ink) 45%,var(--paper))}
input:focus-visible,select:focus-visible{outline:none;border-bottom-width:3px;padding-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips label{display:inline-flex;align-items:center;margin:0;padding:8px 16px;border-radius:999px;background:var(--soft);font-size:.95rem;cursor:pointer;transition:background .15s}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--emerald);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.range{display:flex;align-items:center;gap:18px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:6em;text-align:right;font-size:1.2rem}
.submit{display:flex;align-items:center;gap:20px;margin-top:44px}
.btn{font:inherit;font-weight:600;font-size:1.05rem;border-radius:999px;padding:15px 30px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{background:#C93114;border-color:#C93114}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink);padding:9px 18px;font-size:.92rem;font-weight:500}
.btn.alt:hover{background:var(--soft);border-color:var(--ink)}
.err{color:#FF9A80;font-size:.95rem;min-height:1.2em}
.bar{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;margin-bottom:22px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{display:inline-flex;align-items:center;font-size:.85rem;padding:5px 12px;border-radius:999px;background:var(--bg)}
.stats{font-family:var(--display);font-size:1.8rem;margin:0 0 24px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dow{font-size:.85rem;color:var(--muted);padding:0 4px 4px}
.cell{min-height:150px;border-radius:14px;padding:12px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
.cell.empty{visibility:hidden}
.cell.off{border:1px solid var(--line)}
.cell .d{color:var(--muted);font-size:.78rem;margin-bottom:4px}
.cell.post{background:var(--pc)}
.cell.post .d{color:color-mix(in srgb,var(--ink) 75%,transparent)}
.cell .meta{font-weight:600}
.cell .fmt{color:color-mix(in srgb,var(--ink) 80%,transparent);margin-bottom:6px}
.cell .topic{line-height:1.35;flex:1}
.cell .pill{align-self:flex-start;margin-top:8px;font-size:.72rem;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--paper) 75%,transparent)}
.empty-state{padding:56px 0;color:var(--muted);border-top:1px solid var(--line);font-size:1.05rem}
footer{border-top:1px solid var(--line);margin-top:80px;padding:32px 0 8px;display:flex;align-items:center;gap:16px;color:var(--muted);font-size:.92rem}
.logo{background:#F9EBD7;border-radius:14px;padding:6px 16px;display:inline-flex;overflow:hidden}
footer img{height:52px;width:auto;display:block;mix-blend-mode:multiply}
@media (max-width:720px){
  .wrap{padding:44px 20px 32px}
  .fields{grid-template-columns:1fr;gap:30px}
  .grid{grid-template-columns:1fr}.dow,.cell.empty,.cell.off{display:none}
  .cell{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Plan a month of content in a minute.</h1>
  <p class="sub">Tell us your niche, platforms and pace. Get a balanced 30-day calendar you can export as a CSV.</p>

  <form id="form" autocomplete="off">
    <div class="fields">
      <div>
        <label class="l" for="niche">Niche or brand topic</label>
        <input type="text" id="niche" placeholder="natural sweeteners" required>
      </div>
      <div>
        <label class="l" for="audience">Audience (optional)</label>
        <input type="text" id="audience" placeholder="health-conscious home cooks">
      </div>
      <div class="full">
        <span class="l">Platforms</span>
        <div class="chips" id="platforms"></div>
      </div>
      <div>
        <label class="l" for="freq">Posts per week</label>
        <div class="range"><input type="range" id="freq" min="1" max="7" value="3"><output id="freqOut">3 per week</output></div>
      </div>
      <div>
        <label class="l" for="goal">Main goal</label>
        <select id="goal">
          <option value="awareness">Build awareness</option>
          <option value="leads" selected>Generate leads</option>
          <option value="sales">Drive sales</option>
        </select>
      </div>
      <div>
        <label class="l" for="start">Start date</label>
        <input type="date" id="start">
      </div>
    </div>
    <div class="submit">
      <button class="btn" type="submit">Generate calendar</button>
      <div class="err" id="err" role="alert"></div>
    </div>
  </form>

  <section aria-live="polite">
    <div id="out"><div class="empty-state">Your calendar will appear here.</div></div>
  </section>

  <footer>
    <span>Built by</span>
    <span class="logo"><img src="logo.png" alt="Adarsh P Biju" onerror="this.parentElement.style.display='none';this.parentElement.nextElementSibling.style.display='inline'"></span>
    <span style="display:none">Adarsh P Biju</span>
  </footer>
</div>

<script>
const PLATFORMS = {
  "Instagram": ["Reel","Carousel","Story series","Static post"],
  "LinkedIn": ["Text post","Document carousel","Poll","Article"],
  "X / Twitter": ["Thread","Single post","Poll"],
  "Facebook": ["Video","Link post","Photo post","Poll"],
  "YouTube": ["Short","Long-form video","Community post"],
  "Blog": ["How-to post","Listicle","Case study","Round-up"],
  "Email": ["Newsletter","Product spotlight","Story email"]
};

const PILLARS = {
  educate: {label:"Educate", color:"var(--c-educate)", cta:"Save this for later", topics:[
    "{n} basics: 5 things beginners get wrong","How to choose the right {n} (a simple checklist)","A myth about {n} that needs to retire",
    "{n} explained in 60 seconds","Step-by-step: getting started with {n}","Common questions about {n}, answered",
    "{n} mistakes to avoid this month","A quick guide to comparing {n} options","What the research says about {n}"]},
  proof: {label:"Social proof", color:"var(--c-proof)", cta:"Tell us your story in the comments", topics:[
    "Customer story: how {a} use {n}","Before and after: results from {n}","Review spotlight: what people say about {n}",
    "A number that shows our {n} progress","Testimonial roundup for {n}","Case study: a real outcome with {n}"]},
  bts: {label:"Behind the scenes", color:"var(--c-bts)", cta:"Follow along for more", topics:[
    "How we make decisions in {n}","A day in the life working with {n}","Why we started with {n}",
    "Meet the people behind {n}","What went wrong this week (and what we learned)","The tools and workflow we use for {n}"]},
  engage: {label:"Engage", color:"var(--c-engage)", cta:"Vote or reply below", topics:[
    "This or that: pick a side on {n}","Ask me anything about {n}","Poll: what is your biggest {n} challenge?",
    "Caption this: a fun {n} moment","Hot take on {n}: agree or disagree?","Share your {n} setup in the comments"]},
  promo: {label:"Promote", color:"var(--c-promo)", cta:"Get started today", topics:[
    "Offer spotlight: why {a} choose us for {n}","Product feature: the one thing people love most about {n}","Limited-time offer for {n}",
    "FAQ: is our {n} right for you?","Free resource: a starter kit for {n}","New arrival or update in our {n} range"]},
  trend: {label:"Trend and news", color:"var(--c-trend)", cta:"Share your take", topics:[
    "What changed in {n} this month","3 trends shaping {n} right now","Industry news: what it means for {a}",
    "Predictions for {n} next quarter","A viral idea we are testing in {n}"]}
};

const GOAL_WEIGHTS = {
  awareness:{educate:3,proof:1,bts:2,engage:3,promo:1,trend:2},
  leads:{educate:4,proof:2,bts:1,engage:2,promo:2,trend:1},
  sales:{educate:2,proof:3,bts:1,engage:1,promo:4,trend:1}
};

// weekday numbers use Monday = 0
const POST_DAYS = {1:[2],2:[1,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){return d.toISOString().slice(0,10)}

function buildPillarSequence(count,weights,rnd){
  const pool=[];
  Object.keys(weights).forEach(k=>{for(let i=0;i<weights[k];i++)pool.push(k)});
  const seq=[];let bag=[];
  while(seq.length<count){
    if(!bag.length)bag=shuffle(pool,rnd);
    let idx=bag.findIndex(p=>p!==seq[seq.length-1]);
    if(idx<0)idx=0;
    seq.push(bag.splice(idx,1)[0]);
  }
  return seq;
}

function generate(opts){
  const rnd=mulberry32(opts.seed);
  const start=new Date(opts.start+"T00:00:00Z");
  const days=[];
  const postDays=POST_DAYS[opts.freq];
  for(let i=0;i<30;i++){
    const d=new Date(start.getTime()+i*86400000);
    const wd=(d.getUTCDay()+6)%7;
    days.push({date:d,wd,post:postDays.includes(wd)});
  }
  const posts=days.filter(x=>x.post);
  const seq=buildPillarSequence(posts.length,GOAL_WEIGHTS[opts.goal],rnd);
  const topicQ={},fmtQ={};
  Object.keys(PILLARS).forEach(k=>topicQ[k]=shuffle(PILLARS[k].topics,rnd));
  opts.platforms.forEach(p=>fmtQ[p]=shuffle(PLATFORMS[p],rnd));
  const used={};
  const aud=opts.audience||"your customers";
  posts.forEach((day,i)=>{
    const pillar=seq[i];
    const platform=opts.platforms[i%opts.platforms.length];
    used[pillar]=(used[pillar]||0);
    const topic=topicQ[pillar][used[pillar]++%topicQ[pillar].length]
      .replace(/\{n\}/g,opts.niche).replace(/\{a\}/g,aud);
    const f=fmtQ[platform];
    const format=f[Math.floor(i/opts.platforms.length)%f.length];
    Object.assign(day,{pillar,platform,format,topic,cta:PILLARS[pillar].cta});
  });
  return days;
}

function render(days,opts){
  const posts=days.filter(d=>d.post);
  const counts={};posts.forEach(p=>counts[p.pillar]=(counts[p.pillar]||0)+1);
  const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let html=`<div class="bar"><div class="legend">${Object.keys(PILLARS).map(k=>`<span style="--bg:${PILLARS[k].color}">${PILLARS[k].label}${counts[k]?` (${counts[k]})`:""}</span>`).join("")}</div>
  <div class="actions"><button class="btn alt" id="regen" type="button">Shuffle ideas</button><button class="btn alt" id="copy" type="button">Copy as text</button><button class="btn alt" id="csv" type="button">Download CSV</button></div></div>
  <p class="stats">${posts.length} posts across ${opts.platforms.length} platform${opts.platforms.length>1?"s":""} in 30 days.</p>
  <div class="grid">${names.map(n=>`<div class="dow">${n}</div>`).join("")}`;
  for(let i=0;i<days[0].wd;i++)html+=`<div class="cell empty"></div>`;
  days.forEach(d=>{
    const label=d.date.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
    if(d.post){
      html+=`<div class="cell post" style="--pc:${PILLARS[d.pillar].color}"><span class="d">${label}</span><span class="meta">${esc(d.platform)}</span><span class="fmt">${esc(d.format)}</span><span class="topic">${esc(d.topic)}</span><span class="pill">${PILLARS[d.pillar].label}</span></div>`;
    }else{
      html+=`<div class="cell off"><span class="d">${label}</span></div>`;
    }
  });
  html+=`</div>`;
  document.getElementById("out").innerHTML=html;
  document.getElementById("regen").onclick=()=>{state.seed=Math.floor(Math.random()*1e9);run()};
  document.getElementById("csv").onclick=()=>downloadCSV(days);
  document.getElementById("copy").onclick=e=>copyText(days,e.target);
}

function rows(days){
  return days.filter(d=>d.post).map(d=>[fmt(d.date),["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][d.wd],d.platform,PILLARS[d.pillar].label,d.format,d.topic,d.cta]);
}
function downloadCSV(days){
  const head=["Date","Day","Platform","Content pillar","Format","Topic idea","Call to action"];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[head,...rows(days)].map(r=>r.map(q).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="content-calendar.csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function copyText(days,btn){
  const text=rows(days).map(r=>`${r[0]} (${r[1]}) | ${r[2]} ${r[4]} | ${r[5]} | CTA: ${r[6]}`).join("\n");
  const done=()=>{const t=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=t,1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>{})}
}

const state={seed:1};
let lastOpts=null;

function readForm(){
  const niche=document.getElementById("niche").value.trim();
  const platforms=[...document.querySelectorAll("#platforms input:checked")].map(i=>i.value);
  const err=document.getElementById("err");
  if(!niche){err.textContent="Add your niche or brand topic.";return null}
  if(!platforms.length){err.textContent="Pick at least one platform.";return null}
  err.textContent="";
  return {niche,audience:document.getElementById("audience").value.trim(),platforms,
    freq:+document.getElementById("freq").value,goal:document.getElementById("goal").value,
    start:document.getElementById("start").value||fmt(new Date())};
}
function run(){
  const o=lastOpts;if(!o)return;
  o.seed=state.seed;
  render(generate(o),o);
}

// setup
const pl=document.getElementById("platforms");
Object.keys(PLATFORMS).forEach((p,i)=>{
  const l=document.createElement("label");
  l.innerHTML=`<input type="checkbox" value="${esc(p)}"${i<2?" checked":""}><span>${esc(p)}</span>`;
  pl.appendChild(l);
});
document.getElementById("start").value=fmt(new Date());
const freq=document.getElementById("freq"),freqOut=document.getElementById("freqOut");
freq.addEventListener("input",()=>freqOut.textContent=freq.value+" per week");
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const o=readForm();if(!o)return;
  lastOpts=o;state.seed=Math.floor(Math.random()*1e9);run();
});
</script>
</body>
</html>
